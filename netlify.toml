# Despliegue de la maqueta en Netlify (sitio estático, sin servidor).
[build]
  base = "maquette"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La maqueta no debe aparecer en Google.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
